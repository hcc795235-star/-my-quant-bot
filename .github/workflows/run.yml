name: Monitor Crypto
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write # 【关键】允许机器人修改仓库文件（用来保存记账本）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python monitor.py
      - name: Commit trades.json # 【关键】自动保存并提交记账本
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trades.json
          git commit -m "Auto update trades" || exit 0
          git push
